# Declarative market definitions. Everything downstream (cutoff generation,
# resampling granularity, UI axis labels) reads from this file. No
# market-specific time constants may appear anywhere else in the codebase.
#
# `source_column` is the column name as it exists in the raw ingested data.
# `target_column` is the clean name used everywhere downstream (feature
# builder, backtest output, UI). Keeping the two separate lets us fix
# misleading source naming (see afrr_pos/afrr_neg below) without touching
# raw data, which is meant to stay immutable.
#
# `dst_convention` — verified empirically against each market's real data
# on the 2026-03-29 spring-forward day, because the two markets do NOT
# follow the same rule:
#   - "variable_period_count": the day genuinely has fewer/more periods on
#     a DST transition day (23h -> 92 quarter-hours; 25h -> 100). Confirmed
#     against real ENTSO-E day-ahead prices, which had exactly 92 rows for
#     2026-03-29. Use src.backtest.cutoffs' pd.date_range-based generation.
#   - "fixed_period_count": always the nominal number of blocks (6 for a
#     4h product), with boundaries computed as this day's local midnight +
#     N*product_length_hours in absolute time — so the last block's END
#     can spill past next calendar day's local midnight on a short day.
#     Confirmed against the real regelleistung.net FCR file for March
#     2026, which published all 6 "NEGPOS_00_04".."NEGPOS_20_24" blocks
#     for 2026-03-29 unchanged, with the last one's parsed delivery_end
#     landing at 2026-03-30 01:00 (not 00:00) as a result.

# ASSUMPTION (PLAN_V6_REVISION.md V6-3): ENTSO-E's Transparency Platform
# regulation only guarantees the day-ahead wind/solar generation forecast
# ([14.1.D]) is published "no later than 18:00 Brussels time, one day before
# actual delivery" (see src/features/availability.py's daily_publication_rule
# docstring for the verified text) -- which is AFTER every one of this
# system's four forecast cutoffs (day_ahead 11:00, fcr 07:00, afrr 08:00, all D-1).
# The user chose to use the forecast as a feature anyway, on the assumption
# that ENTSO-E in practice publishes it earlier than the regulatory deadline.
# This key is that assumption, made explicit and visible rather than a
# silently different cutoff baked into src/features/build.py. It is recorded
# in every run's metadata (kept_features/dropped_features) and surfaced in
# the bess-optimizer dashboard's assumptions box.
# Real replacement: observe ENTSO-E's actual publication times for this
# document over a few weeks and set this to the measured value.
entsoe_generation_forecast_published_local: "07:00"

day_ahead:
  # NOTE: EU-wide SDAC reform moved day-ahead from hourly to 15-minute
  # Market Time Units, live since delivery day 2025-10-01 (confirmed
  # against EPEX SPOT's own announcement and cross-checked against real
  # ENTSO-E data: every day-ahead price we ingested for 2026 is already
  # quarter-hourly). The auction's gate closure stayed at 12:00 CET D-1 —
  # only the product granularity changed (96 x 15-min blocks/day instead
  # of 24 hourly prices) — confirmed via Modo Energy's own description of
  # the current auction. Historical data from before 2025-10-01 is still
  # hourly; this config describes the CURRENT product only, so a backtest
  # spanning the transition would need per-period handling this repo
  # doesn't attempt.
  source_column: da_price_eur_mwh
  target_column: da_price_eur_mwh
  unit: EUR/MWh
  product_length_hours: 0.25
  dst_convention: variable_period_count
  gate_closure_local: "12:00"
  gate_closure_offset_days: -1
  forecast_cutoff_local: "11:00"
  delivery_start_local: "00:00"
  horizons_hours: [24, 48]
  timezone: Europe/Berlin
  # PLAN_V5_REVISION.md V5-5: when a lagged auction price is actually known
  # (not at its own delivery time -- it's an auction price, published the
  # day before). EPEX SPOT SDAC Final Market Coupling Results publish at
  # 12:57 CET (epexspot.com "SDAC Timings and Market Messages", retrieved
  # 2026-09-23); rounded up to 13:00 for a safety margin.
  results_published_local: "13:00"

fcr:
  source_column: fcr_price_eur_mw
  target_column: fcr_price_eur_mw
  unit: EUR/MW
  product_length_hours: 4
  dst_convention: fixed_period_count
  gate_closure_local: "08:00"
  gate_closure_offset_days: -1
  forecast_cutoff_local: "07:00"
  delivery_start_local: "00:00"
  horizons_hours: [24]
  timezone: Europe/Berlin
  symmetric: true
  pricing: pay_as_cleared
  # ASSUMPTION (PLAN_V5_REVISION.md V5-5): regelleistung.net's exact result-
  # publication time could not be confirmed (retrieved 2026-09-23) -- using
  # gate closure (08:00) + 2h. lag_24h's ~22h margin makes the exact value
  # irrelevant to whether it clears the cutoff.
  results_published_local: "10:00"

afrr_pos:
  # NOTE: source column is misleadingly named "_eur_mwh" in the raw file but
  # the values are constant across every 4h block (verified in Milestone 0
  # inventory) — this is a capacity price in EUR/MW, not an energy price.
  # Corrected here; raw data is left as-is.
  source_column: afrr_pos_price_eur_mwh
  target_column: afrr_pos_capacity_eur_mw
  unit: EUR/MW
  direction: positive
  product_length_hours: 4
  dst_convention: fixed_period_count
  gate_closure_local: "09:00"
  gate_closure_offset_days: -1
  forecast_cutoff_local: "08:00"
  delivery_start_local: "00:00"
  horizons_hours: [24]
  timezone: Europe/Berlin
  pricing: pay_as_bid
  # ASSUMPTION (PLAN_V5_REVISION.md V5-5): see fcr's results_published_local
  # note -- unconfirmed, using gate closure (09:00) + 2h.
  results_published_local: "11:00"

afrr_neg:
  # See afrr_pos note above — same mislabeling in the raw source column.
  source_column: afrr_neg_price_eur_mwh
  target_column: afrr_neg_capacity_eur_mw
  unit: EUR/MW
  direction: negative
  product_length_hours: 4
  dst_convention: fixed_period_count
  gate_closure_local: "09:00"
  gate_closure_offset_days: -1
  forecast_cutoff_local: "08:00"
  delivery_start_local: "00:00"
  horizons_hours: [24]
  timezone: Europe/Berlin
  pricing: pay_as_bid
  # ASSUMPTION (PLAN_V5_REVISION.md V5-5): see fcr's results_published_local
  # note -- unconfirmed, using gate closure (09:00) + 2h.
  results_published_local: "11:00"
